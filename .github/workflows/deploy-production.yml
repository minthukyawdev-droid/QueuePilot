name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy-web:
    name: Deploy web to Netlify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}

    steps:
      - name: Check out validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Verify Netlify configuration
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"
          test -n "$NEXT_PUBLIC_API_BASE_URL"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Deploy production site
        run: >-
          npx --yes netlify-cli@27.3.0 deploy
          --build
          --prod
          --site "$NETLIFY_SITE_ID"
          --auth "$NETLIFY_AUTH_TOKEN"

  deploy-api:
    name: Deploy API to AWS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_HOST: ${{ vars.AWS_HOST }}
      AWS_USER: ${{ vars.AWS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
      AWS_KNOWN_HOSTS: ${{ secrets.AWS_KNOWN_HOSTS }}

    steps:
      - name: Check out validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure SSH
        run: |
          test -n "$AWS_HOST"
          test -n "$AWS_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$AWS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/queuepilot.pem"
          printf '%s\n' "$AWS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/queuepilot.pem" "$HOME/.ssh/known_hosts"

      - name: Deploy API release
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/queuepilot.pem" \
            "$AWS_USER@$AWS_HOST" \
            "bash -s -- '$DEPLOY_SHA'" < infra/aws/deploy-api.sh
